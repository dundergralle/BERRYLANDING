<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100%;
    min-height: 100dvh;
    background: #ffd6e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    padding-top: max(2rem, env(safe-area-inset-top));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    padding-left: max(1.5rem, env(safe-area-inset-left));
    padding-right: max(1.5rem, env(safe-area-inset-right));
    text-size-adjust: 100%;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
    position: relative;
  }
  .berry {
    position: fixed;
    font-size: 1.4rem;
    pointer-events: none;
    animation: float linear infinite;
    opacity: 0.75;
    z-index: 0;
    user-select: none;
  }
  @keyframes float {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    5%   { opacity: 0.55; }
    95%  { opacity: 0.55; }
    100% { transform: translateY(-12vh) rotate(360deg); opacity: 0; }
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; font-weight: 600; color: #111; margin-bottom: 0.35rem; letter-spacing: -0.01em; }
  .tagline { font-size: 0.9rem; color: #888; margin-bottom: 0.75rem; text-align: center; line-height: 1.4; }
  .location-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 20px; padding: 6px 14px; font-size: 0.78rem; color: #555; margin-bottom: 1.75rem; min-height: 32px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .buttons { display: flex; flex-direction: column; gap: 0.65rem; width: 100%; max-width: 340px; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 0 1rem; border-radius: 50px; background: #e05577; color: #fff; font-size: 1rem; font-weight: 500; text-align: center; text-decoration: none; border: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: opacity 0.1s; }
  .btn:active { opacity: 0.75; }
  @media (hover: hover) { .btn:hover { opacity: 0.88; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); }
    30% { transform: translateX(5px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    90% { transform: translateX(2px); }
  }
  .btn-shake.shaking { animation: shake 0.8s ease; }
</style>
</head>
<body>

<script>
if (window.location.pathname === '/link') {
  window.location.replace('https://www.youtube.com/watch?v=QxYQeQtkYtM');
}
</script>

<script>
(function() {
  var count = 40;
  for (var i = 0; i < count; i++) {
    (function(i) {
      var el = document.createElement('span');
      el.className = 'berry';
      el.textContent = '🍓';
      var left = Math.random() * 100;
      var duration = 8 + Math.random() * 14;
      var delay = -(Math.random() * duration);
      var size = 1.1 + Math.random() * 1.6;
      el.style.cssText = 'left:' + left + 'vw;animation-duration:' + duration + 's;animation-delay:' + delay + 's;font-size:' + size + 'rem;';
      document.body.appendChild(el);
    })(i);
  }
})();
</script>

<div class="content">
  <img class="avatar" src="https://github.com/dundergralle/BERRYLANDING/blob/main/photo_2026-05-03_15-57-43.jpg?raw=true" alt="Profile" onerror="this.style.background='#e5e7eb';this.removeAttribute('src')">
  <h1>BerryBusig</h1>
  <p class="tagline">Alla mina plattformar</p>
  <div class="location-pill">
    <span class="dot"></span>
    <span id="loc-text">5 minutes ago in: ...</span>
  </div>
  <div class="buttons">
    <a class="btn btn-shake" href="/link" target="_blank">Se mera av mig</a>
    <a class="btn" href="https://www.instagram.com/berrybusig/" target="_blank">Insta</a>
  </div>
</div>

<script>
(function() {
  var fallbacks = [
    "Stockholm","Göteborg","Malmö","Uppsala","Linköping","Örebro","Västerås",
    "Helsingborg","Norrköping","Jönköping","Umeå","Lund","Gävle","Borås","Sundsvall",
    "Oslo","Bergen","Trondheim","Stavanger","Drammen","Kristiansand","Tromsø","Ålesund",
    "København","Aarhus","Odense","Aalborg","Esbjerg","Randers","Kolding","Vejle",
    "Helsinki","Espoo","Tampere","Vantaa","Oulu","Turku","Jyväskylä","Lahti"
  ];
  function setCity(city) {
    var c = (city && city.trim().length > 1) ? city.trim() : fallbacks[Math.floor(Math.random() * fallbacks.length)];
    document.getElementById('loc-text').textContent = '5 minutes ago in: ' + c;
  }
  function get(url, extract) {
    return fetch(url, { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(d) {
      var v = extract(d);
      if (!v || v.trim().length < 2) throw new Error('no city');
      return v;
    });
  }
  get('https://ipinfo.io/json', function(d) { return d && d.city; })
    .catch(function() { return get('https://ip-api.com/json/?fields=city,regionName', function(d) { return d && (d.city || d.regionName); }); })
    .catch(function() { return get('https://ipapi.co/json/', function(d) { return d && (d.city || d.region); }); })
    .then(function(city) { setCity(city); })
    .catch(function() { setCity(null); });
})();
</script>

<script>
(function() {
  var btn = document.querySelector('.btn-shake');
  function triggerShake() {
    btn.classList.add('shaking');
    btn.addEventListener('animationend', function onEnd() {
      btn.removeEventListener('animationend', onEnd);
      btn.classList.remove('shaking');
      setTimeout(triggerShake, 4000);
    });
  }
  setTimeout(triggerShake, 3000);
})();
</script>
</body>
</html>
